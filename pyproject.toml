[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tinycoder"
version = "0.1.0"
description = "Terminal coding assistant for small local LLMs via constrained JSON decoding"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "tinycoder" }]
license = { text = "MIT" }
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.6",
    "rich>=13.7",
]

[project.scripts]
tinycoder = "tinycoder.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/tinycoder"]
